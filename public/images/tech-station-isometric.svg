<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Isometric Tech Workstation with VR engineer and cables in Saluang colors -->
  <g transform="translate(40, 30)">
    <!-- Floor Shadow -->
    <ellipse cx="210" cy="420" rx="170" ry="35" fill="#3A1F3D" opacity="0.15"/>

    <!-- Central Computer Station (Yellow & Coral) -->
    <g transform="translate(80, 160)">
      <!-- Main Desk / Server Base -->
      <path d="M40 70 L150 120 L150 200 L40 150 Z" fill="#F4B223" stroke="#3A1F3D" stroke-width="6" stroke-linejoin="round"/>
      <path d="M150 120 L240 80 L240 160 L150 200 Z" fill="#E5A315" stroke="#3A1F3D" stroke-width="6" stroke-linejoin="round"/>
      <path d="M40 70 L130 30 L240 80 L150 120 Z" fill="#FDE178" stroke="#3A1F3D" stroke-width="6" stroke-linejoin="round"/>

      <!-- Server Rack Slots -->
      <rect x="60" y="95" width="70" height="15" rx="3" fill="#3A1F3D" transform="skewY(24)"/>
      <rect x="60" y="125" width="70" height="15" rx="3" fill="#2DBE9B" stroke="#3A1F3D" stroke-width="3" transform="skewY(24)"/>
      <circle cx="75" cy="115" r="3" fill="#7ED3C6"/>
      <circle cx="85" cy="119" r="3" fill="#EF5B4D"/>
      <circle cx="95" cy="123" r="3" fill="#FDE178"/>

      <!-- Upper Monitor / Hologram Rig -->
      <path d="M80 20 L140 50 L140 90 L80 60 Z" fill="#7ED3C6" stroke="#3A1F3D" stroke-width="5" stroke-linejoin="round"/>
      <path d="M140 50 L190 25 L190 65 L140 90 Z" fill="#2DBE9B" stroke="#3A1F3D" stroke-width="5" stroke-linejoin="round"/>
      <path d="M80 20 L130 -5 L190 25 L140 50 Z" fill="#A5E7DD" stroke="#3A1F3D" stroke-width="5" stroke-linejoin="round"/>

      <!-- Antenna on top with lightning bolt -->
      <line x1="130" y1="-5" x2="130" y2="-45" stroke="#3A1F3D" stroke-width="5" stroke-linecap="round"/>
      <circle cx="130" cy="-48" r="8" fill="#EF5B4D" stroke="#3A1F3D" stroke-width="4"/>
      <path d="M128 -70 L122 -55 L132 -55 L126 -40 L138 -58 L128 -58 Z" fill="#F4B223" stroke="#3A1F3D" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- Cables on the floor (Teal & Yellow) -->
    <path d="M120 330 C70 340 50 370 70 395 C90 415 150 400 190 420" stroke="#EF5B4D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M220 320 C270 350 280 390 250 415" stroke="#2DBE9B" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- VR Engineer Character on Left -->
    <g transform="translate(30, 320)">
      <ellipse cx="25" cy="80" rx="22" ry="8" fill="#FDE178" stroke="#3A1F3D" stroke-width="3"/>
      <!-- Legs -->
      <line x1="18" y1="80" x2="18" y2="55" stroke="#3A1F3D" stroke-width="4"/>
      <line x1="30" y1="80" x2="30" y2="55" stroke="#3A1F3D" stroke-width="4"/>
      <!-- Body / Shirt (White) -->
      <rect x="14" y="28" width="22" height="28" rx="6" fill="#FFFFFF" stroke="#3A1F3D" stroke-width="3.5"/>
      <!-- Head -->
      <circle cx="25" cy="18" r="8.5" fill="#FDE178" stroke="#3A1F3D" stroke-width="3.5"/>
      <!-- VR Headset (Teal) -->
      <rect x="23" y="14" width="13" height="8" rx="3" fill="#2DBE9B" stroke="#3A1F3D" stroke-width="2.5"/>
      <!-- Arm with Cable -->
      <path d="M36 38 Q48 42 55 35" stroke="#3A1F3D" stroke-width="3.5" fill="none"/>
    </g>

    <!-- Engineer Character on Right -->
    <g transform="translate(330, 270)">
      <ellipse cx="20" cy="85" rx="18" ry="7" fill="#FDE178" stroke="#3A1F3D" stroke-width="3"/>
      <line x1="14" y1="85" x2="14" y2="60" stroke="#3A1F3D" stroke-width="4"/>
      <line x1="26" y1="85" x2="26" y2="60" stroke="#3A1F3D" stroke-width="4"/>
      <!-- Shirt (Teal) -->
      <rect x="10" y="32" width="20" height="28" rx="6" fill="#2DBE9B" stroke="#3A1F3D" stroke-width="3.5"/>
      <!-- Head -->
      <circle cx="20" cy="20" r="8" fill="#FDE178" stroke="#3A1F3D" stroke-width="3.5"/>
      <!-- Glasses/Hair -->
      <rect x="15" y="16" width="10" height="4" rx="2" fill="#3A1F3D"/>
    </g>

    <!-- Floating UI Widgets / Windows -->
    <g transform="translate(50, 110)">
      <rect x="0" y="0" width="45" height="60" rx="8" fill="#FFFDF9" stroke="#3A1F3D" stroke-width="3.5"/>
      <rect x="8" y="10" width="29" height="6" rx="2" fill="#2DBE9B"/>
      <rect x="8" y="22" width="20" height="4" rx="2" fill="#EF5B4D"/>
      <rect x="8" y="30" width="25" height="4" rx="2" fill="#F4B223"/>
      <rect x="8" y="38" width="15" height="4" rx="2" fill="#7ED3C6"/>
    </g>

    <g transform="translate(320, 110)">
      <rect x="0" y="0" width="55" height="45" rx="8" fill="#FFFDF9" stroke="#3A1F3D" stroke-width="3.5"/>
      <path d="M15 28 L23 15 L32 25 L40 18" stroke="#EF5B4D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="40" cy="18" r="3" fill="#2DBE9B"/>
    </g>
  </g>
</svg>
