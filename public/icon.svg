  <!-- Body -->
  <path d="M35 172 C45 135 105 130 152 160 C135 195 75 200 35 172 Z" fill="#F4B223" stroke="#3A1F3D" stroke-width="7.5" stroke-linejoin="round"/>
  <!-- Belly (White highlight) -->
