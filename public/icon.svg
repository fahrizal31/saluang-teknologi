  <line x1="38" y1="102" x2="68" y2="102" stroke="#3A1F3D" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="30" y1="138" x2="55" y2="138" stroke="#3A1F3D" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Mountains -->
  <path d="M70 160 L105 105 L145 160 Z" fill="#2DBE9B" stroke="#3A1F3D" stroke-width="7" stroke-linejoin="round"/>
  <path d="M125 160 L145 130 L165 160 Z" fill="#7ED3C6" stroke="#3A1F3D" stroke-width="7" stroke-linejoin="round"/>

  <!-- Digital Circuit Trees / Antennas -->
  <line x1="145" y1="140" x2="145" y2="38" stroke="#3A1F3D" stroke-width="7" stroke-linecap="round"/>
  <circle cx="145" cy="33" r="12" fill="#EF5B4D" stroke="#3A1F3D" stroke-width="5.5"/>

  <line x1="170" y1="145" x2="170" y2="65" stroke="#3A1F3D" stroke-width="7" stroke-linecap="round"/>
