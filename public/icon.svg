  <!-- Fish Head & Eye -->
  <circle cx="132" cy="162" r="5" fill="#3A1F3D"/>
  <circle cx="134" cy="160" r="1.8" fill="#FFFFFF"/>
  <path d="M125 152 C120 162 120 172 125 178" stroke="#3A1F3D" stroke-width="4.5" stroke-linecap="round" fill="none"/>
