  <line x1="192" y1="150" x2="192" y2="92" stroke="#3A1F3D" stroke-width="7" stroke-linecap="round"/>
  <circle cx="192" cy="87" r="10" fill="#F4B223" stroke="#3A1F3D" stroke-width="5.5"/>

  <!-- Lower Crest / River Basin -->
  <path d="M38 185 C38 240 80 272 135 272 C190 272 232 238 232 185 C232 175 195 180 160 190 C110 205 60 195 38 185 Z" fill="#2DBE9B" stroke="#3A1F3D" stroke-width="7.5" stroke-linejoin="round"/>

  <!-- River Flow Lines & Circuit Nodes -->
  <path d="M48 200 C80 235 150 205 218 200" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <circle cx="76" cy="225" r="9" fill="#FFFFFF" stroke="#3A1F3D" stroke-width="4.5"/>
  <circle cx="160" cy="215" r="9" fill="#FFFFFF" stroke="#3A1F3D" stroke-width="4.5"/>

  <!-- Leaping Saluang Fish -->
  <!-- Tail -->
  <path d="M30 178 C15 170 18 150 28 155 C38 160 48 168 55 174 Z" fill="#EF5B4D" stroke="#3A1F3D" stroke-width="6.5" stroke-linejoin="round"/>
  <!-- Fin Bottom -->
